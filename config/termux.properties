# Terminal Magique — réglages du terminal avancé (~/.termux/termux.properties)

# Barre de touches spéciales (2 rangées) au-dessus du clavier
extra-keys = [ \
  ['ESC','|','/','-','HOME','UP','END','PGUP','DEL'], \
  ['TAB','CTRL','ALT','~','LEFT','DOWN','RIGHT','PGDN','KEYBOARD'] \
]
extra-keys-style = default

# Les touches de volume servent de Ctrl / Alt… (Volume bas + C = Ctrl+C)
volume-keys = virtual

# Pas de bip, juste une vibration
bell-character = vibrate

# Curseur clignotant, en bloc
terminal-cursor-blink-rate = 600
terminal-cursor-style = block

# Grand historique de défilement
terminal-transcript-rows = 20000

# Raccourcis : Ctrl+Alt+C = nouvelle session, Ctrl+Alt+flèches = changer de session
shortcut.create-session = ctrl + alt + c
shortcut.next-session = ctrl + alt + right
shortcut.previous-session = ctrl + alt + left
shortcut.rename-session = ctrl + alt + r

# Les autres applis (ex. Tasker) ne peuvent pas lancer de commandes
allow-external-apps = false
