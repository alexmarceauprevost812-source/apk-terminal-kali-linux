name: Construire l'APK Terminal Magique

on:
  push:
    branches: [main]
    paths:
      - 'apk/**'
      - 'bin/**'
      - 'config/**'
      - 'install.sh'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Construire l'APK
        env:
          VERSION_MAGIE: 1.0.${{ github.run_number }}
        run: bash apk/construire.sh

      - name: Conserver les APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: terminal-magique-1.0.${{ github.run_number }}
          path: sortie-apk/*

      - name: Publier la version (téléchargeable depuis le téléphone)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Terminal Magique 1.0.${{ github.run_number }}
          make_latest: true
          files: sortie-apk/*
          body: |
            🐧 **Terminal Magique** — un vrai terminal Linux avancé pour Android (IA gratuites en option).

            **Samsung Galaxy S25 Ultra** : téléchargez `terminal-magique-1.0.${{ github.run_number }}-arm64-v8a.apk`
            (l'APK `universal` fonctionne sur tous les téléphones).

            ⚠️ Désinstallez d'abord Termux s'il est déjà installé (même nom de paquet `com.termux`).
