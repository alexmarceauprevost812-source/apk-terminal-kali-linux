name: Construire l'APK Terminal Magique

on:
  push:
    branches: [main]
    paths:
      - 'apk/**'
      - 'bin/**'
      - 'config/**'
      - 'install.sh'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Construire l'APK
        env:
          VERSION_MAGIE: 1.0.${{ github.run_number }}
        run: bash apk/construire.sh

      - name: Signer avec la clé commune LexOS
        env:
          LEXOS_KEYSTORE_BASE64: ${{ secrets.LEXOS_KEYSTORE_BASE64 }}
          LEXOS_KEYSTORE_PASSWORD: ${{ secrets.LEXOS_KEYSTORE_PASSWORD }}
          LEXOS_KEY_ALIAS: ${{ secrets.LEXOS_KEY_ALIAS }}
        run: |
          if [ -z "$LEXOS_KEYSTORE_BASE64" ]; then
            echo "::warning::Clé commune LexOS absente (secrets non disponibles) : l'APK garde sa signature de test."
            exit 0
          fi
          echo "$LEXOS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lexos.keystore"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          for apk in sortie-apk/*.apk; do
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/lexos.keystore" --ks-key-alias "$LEXOS_KEY_ALIAS" \
              --ks-pass env:LEXOS_KEYSTORE_PASSWORD --key-pass env:LEXOS_KEYSTORE_PASSWORD \
              --out "$apk.signed" "$apk"
            mv "$apk.signed" "$apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -n 3
          done
          rm -f "$RUNNER_TEMP/lexos.keystore"

      - name: Conserver les APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: terminal-magique-1.0.${{ github.run_number }}
          path: sortie-apk/*

      - name: Publier la version (téléchargeable depuis le téléphone)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Terminal Magique 1.0.${{ github.run_number }}
          make_latest: true
          files: sortie-apk/*
          body: |
            🐉 **Terminal Magique** — le vrai terminal Kali Linux sur Android, sans root (thème noir, écriture blanche, nom d'utilisateur vert lime).

            **Samsung Galaxy S25 Ultra** : téléchargez `terminal-magique-1.0.${{ github.run_number }}-arm64-v8a.apk`
            (l'APK `universal` fonctionne sur tous les téléphones).

            ⚠️ Désinstallez d'abord Termux s'il est déjà installé (même nom de paquet `com.termux`).
